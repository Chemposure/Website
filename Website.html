<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Nathan's First Website</title>

  <!-- External Stylesheet -->
  <link rel="stylesheet" href="style.css" />
</head>

<body>

  <!-- HEADER -->
  <header>
    <h1>Welcome to My Website</h1>
  </header>

  <!-- NAVIGATION TABS -->
  <nav>
    <div class="tab">
      <button class="tablinks" onclick="openTab(event, 'About')">About</button>
      <button class="tablinks" onclick="openTab(event, 'Contact')">Contact</button>
      <button class="tablinks" onclick="openTab(event, 'Links')">Links</button>
    </div>
  </nav>

  <!-- ABOUT TAB -->
  <section id="About" class="tabcontent">
    <h2>About</h2>
    <h3>Exposure Analytics</h3>
    <p>
      Exposure Analytics is the market leader<br />
      in analytics for events.
    </p>
    <img 
      src="https://process.filestackapi.com/cache=expiry:max/N6YNXaFGSdqOlgeJbBwF"
      alt="Exposure Analytics"
      width="400"
      height="300"
    />
  </section>

  <!-- CONTACT TAB -->
  <section id="Contact" class="tabcontent">
    <h2>Contact</h2>
    <p>Email: <a href="mailto:nathan@exposureanalytics.com">nathan@exposureanalytics.com</a></p>
    <p>Phone: +44 7911 123456</p>
  </section>

  <!-- LINKS TAB -->
  <section id="Links" class="tabcontent">
    <h2>Links</h2>
    <a href="https://www.exposureanalytics.com" target="_blank" rel="noopener noreferrer">
      Exposure Analytics
    </a>
  </section>

  <!-- ASIDE LOGO -->
  <aside>
    <img
      src="https://exposureanalytics.com/wp-content/themes/starboard/assets/img/exposure.png"
      alt="Exposure Analytics"
      width="200"
      height="100"
    />
  </aside>

  <!-- MAIN CONTENT -->
  <main>
    <img
      src="data:image/jpeg;base64,/9j/4AAQSkZJRgABAQAAAQABAAD/..."
      alt="Exposure Analytics Logo"
      width="200"
      height="100"
    />

    <h4>Send us a message</h4>

    <form>
      <label for="name">Name:</label><br />
      <input type="text" id="name" name="name" /><br /><br />

      <label for="email">Email:</label><br />
      <input type="email" id="email" name="email" /><br /><br />

      <label for="phone">Phone Number:</label><br />
      <input type="tel" id="phone" name="phone" /><br /><br />

      <label for="message">Message:</label><br />
      <textarea id="message" name="message" rows="4" cols="50"></textarea><br /><br />

      <div class="popup" onclick="myFunction()">
        Submit!
        <span class="popuptext" id="myPopup">Successfully submitted!</span>
      </div>
    </form>
  </main>

  <!-- JAVASCRIPT -->
  <script src="scripts.js"></script>

 <body style="text-align:center"></body>
</body>
</html>
